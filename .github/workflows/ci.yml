# This GitHub Actions workflow automatically checks our project
# whenever changes are pushed to the master branch.
# It installs the required Python packages, runs backend tests,
# and builds Docker images to make sure everything works.
# This helps us catch errors before deploying the application.

name: YMB CI Pipeline
name: YMB CI Pipeline
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        run: python -m pytest backend/tests -q
      - name: Build Docker images
        run: docker compose build
